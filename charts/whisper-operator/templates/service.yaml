apiVersion: v1
kind: Service
metadata:
  name: {{ include "whisper-operator.webhookService" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "whisper-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "whisper-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
