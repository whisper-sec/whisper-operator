---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: whisperegresses.egress.whisper.security
spec:
  group: egress.whisper.security
  names:
    kind: WhisperEgress
    listKind: WhisperEgressList
    plural: whisperegresses
    shortNames:
    - wegress
    singular: whisperegress
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.secretRef.name
      name: Secret
      type: string
    - jsonPath: .spec.tier
      name: Tier
      type: string
    - jsonPath: .status.injectedPods
      name: Injected
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WhisperEgress holds per-namespace defaults for Whisper egress sidecar
          injection. It is OPTIONAL: the webhook works with zero WhisperEgress
          objects installed - pod annotations alone are enough.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WhisperEgressSpec holds per-namespace defaults for Whisper egress injection.
              Every field is optional: pod annotations override these, and these override
              the operator's chart-level defaults (Postel: sensible defaults everywhere).
            properties:
              agentNamePrefix:
                description: |-
                  AgentNamePrefix seeds the human name used if a brand-new Whisper agent
                  has to be created for a pod (accounts with existing agents reuse them).
                type: string
              image:
                description: Image overrides the sidecar image. Default ghcr.io/whisper-sec/whisper:latest.
                type: string
              mode:
                description: |-
                  Mode selects how app traffic reaches the sidecar: "proxy" (default -
                  HTTP(S)_PROXY/ALL_PROXY env pointing at the local sidecar proxy).
                enum:
                - proxy
                type: string
              port:
                description: Port is the local loopback port the sidecar proxy listens
                  on. Default 18080.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              secretRef:
                description: |-
                  SecretRef names the Secret holding the Whisper API key.
                  Default: {name: whisper, key: api-key}.
                properties:
                  key:
                    description: Key inside the Secret holding the API key. Defaults
                      to "api-key".
                    type: string
                  name:
                    description: Name of the Secret (in the same namespace as the
                      pods).
                    type: string
                required:
                - name
                type: object
              tier:
                description: |-
                  Tier selects the egress tier: "socks5" (default, zero-privilege) or
                  "wireguard" (routed /128; requires TUN support in the pod).
                enum:
                - socks5
                - wireguard
                type: string
            type: object
          status:
            description: WhisperEgressStatus reports the observed state.
            properties:
              conditions:
                description: Conditions follow the standard Kubernetes condition conventions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              injectedPods:
                description: |-
                  InjectedPods is the number of pods in this namespace currently carrying
                  an injected Whisper sidecar.
                format: int32
                type: integer
              lastError:
                description: |-
                  LastError surfaces the most recent configuration problem (e.g. the
                  referenced Secret is missing), empty when healthy.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
